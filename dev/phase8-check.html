<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Phase 8 check</title>
  <style>
    body { font-family: system-ui, sans-serif; font-size: 14px; padding: 16px; max-width: 900px; margin: 0 auto; }
    h1 { font-size: 18px; }
    h2 { font-size: 15px; margin-top: 24px; }
    .row { display: flex; gap: 8px; align-items: baseline; padding: 2px 0; font-family: monospace; font-size: 12.5px; }
    .pass { color: #2e7d32; }
    .fail { color: #d32f2f; font-weight: bold; }
    .badge { display: inline-block; width: 3.5em; }
    #summary { font-size: 16px; font-weight: bold; margin: 12px 0; }
  </style>
  <link rel="stylesheet" href="../css/main.css">
</head>
<body>
  <h1>Phase 8 check — packager.js + packaging.js</h1>
  <p>Open via a local server. Drives js/core/packager.js's pure ZIP/manifest/validation logic
  directly, then js/ui/packaging.js's dialog against markup mirroring index.html.</p>

  <div id="summary">running…</div>
  <div id="results"></div>

  <h2>Live dialog stage (mirrors index.html's ids)</h2>
  <span id="top-status" class="toolbar-status"></span>
  <button id="create-package-btn" type="button" disabled>Create Submission Package</button>
  <div id="package-dialog-overlay" class="hidden"></div>
  <div id="loading-overlay" class="hidden"><span id="loading-text"></span></div>

  <script type="module">
    import { findRootFileCandidates, flattenFromRoot } from '../js/core/flattener.js';
    import { SchemaParser, findRootElementCandidates, analyzePacket } from '../js/core/parser.js';
    import { FormEngine, FormInstanceKey } from '../js/core/formEngine.js';
    import { buildPacketXml } from '../js/core/xmlWriter.js';
    import * as packager from '../js/core/packager.js';
    import * as packagingUi from '../js/ui/packaging.js';

    const resultsEl = document.getElementById('results');
    const summaryEl = document.getElementById('summary');

    let pass = 0, fail = 0;
    function check(label, condition, detail = '') {
      const row = document.createElement('div');
      row.className = 'row';
      const ok = !!condition;
      ok ? pass++ : fail++;
      row.innerHTML = `<span class="badge ${ok ? 'pass' : 'fail'}">${ok ? 'PASS' : 'FAIL'}</span><span>${label}${detail ? ' — ' + detail : ''}</span>`;
      resultsEl.appendChild(row);
      if (!ok) console.error('FAIL:', label, detail);
    }

    function clearLocalStorage() {
      try { localStorage.removeItem('xmlEditor.lastPackagingSettings'); } catch {}
    }

    // Minimal ZIP reader (inverse of packager.js's buildZip) — verifies the
    // hand-rolled writer really produces a spec-conformant archive by parsing
    // it back with no dependency on the writer's own internals, and
    // decompressing via the browser's native DecompressionStream (the exact
    // inverse of CompressionStream, so a round-trip mismatch would mean the
    // writer produced a genuinely broken deflate stream, not a test artifact).
    async function readZip(blob) {
      const buf = new Uint8Array(await blob.arrayBuffer());
      const dv = new DataView(buf.buffer);
      const eocdOffset = buf.length - 22;
      if (dv.getUint32(eocdOffset, true) !== 0x06054b50) throw new Error('EOCD signature not found at expected offset');
      const totalEntries = dv.getUint16(eocdOffset + 10, true);
      const centralDirOffset = dv.getUint32(eocdOffset + 16, true);

      const entries = [];
      let offset = centralDirOffset;
      for (let i = 0; i < totalEntries; i++) {
        if (dv.getUint32(offset, true) !== 0x02014b50) throw new Error(`Central directory signature mismatch at entry ${i}`);
        const method = dv.getUint16(offset + 10, true);
        const crc = dv.getUint32(offset + 16, true);
        const compressedSize = dv.getUint32(offset + 20, true);
        const uncompressedSize = dv.getUint32(offset + 24, true);
        const nameLen = dv.getUint16(offset + 28, true);
        const extraLen = dv.getUint16(offset + 30, true);
        const commentLen = dv.getUint16(offset + 32, true);
        const localHeaderOffset = dv.getUint32(offset + 42, true);
        const name = new TextDecoder().decode(buf.slice(offset + 46, offset + 46 + nameLen));
        entries.push({ name, method, crc, compressedSize, uncompressedSize, localHeaderOffset });
        offset += 46 + nameLen + extraLen + commentLen;
      }

      for (const entry of entries) {
        const lo = entry.localHeaderOffset;
        if (dv.getUint32(lo, true) !== 0x04034b50) throw new Error(`Local header signature mismatch for ${entry.name}`);
        const lNameLen = dv.getUint16(lo + 26, true);
        const lExtraLen = dv.getUint16(lo + 28, true);
        const dataStart = lo + 30 + lNameLen + lExtraLen;
        const compressedData = buf.slice(dataStart, dataStart + entry.compressedSize);
        if (entry.method === 8) {
          const ds = new DecompressionStream('deflate-raw');
          const writer = ds.writable.getWriter();
          writer.write(compressedData);
          writer.close();
          entry.data = new Uint8Array(await new Response(ds.readable).arrayBuffer());
        } else {
          entry.data = compressedData;
        }
        entry.text = new TextDecoder().decode(entry.data);
      }
      return entries;
    }

    async function main() {
      clearLocalStorage();

      // ==================================================================
      // A. crc32 — standard test vectors
      // ==================================================================
      {
        check('crc32 of empty input is 0', packager.crc32(new Uint8Array(0)) === 0);
        check('crc32("123456789") matches the standard CRC-32 check value', packager.crc32(new TextEncoder().encode('123456789')) === 0xcbf43926);
      }

      // ==================================================================
      // B. validatePackagingSettings — §19 workflow step 3
      // ==================================================================
      {
        const empty = packager.validatePackagingSettings({});
        check('An empty settings object fails validation', empty.length > 0);
        check('...including a category error', empty.some((e) => e.field === 'category'));

        const validIndividual = {
          submissionId: '1234567890123ABCDEFG', efin: '123456', taxYear: '2024', governmentCode: 'CA01',
          submissionType: 'HIN11', category: 'Individual', primarySSN: '123456789', primaryNameControl: 'SMIT',
        };
        check('A well-formed Individual settings object passes with no errors', packager.validatePackagingSettings(validIndividual).length === 0);

        const validBusiness = {
          submissionId: '1234567890123ABCDEFG', efin: '123456', taxYear: '2024', governmentCode: 'CA01',
          submissionType: 'HIN11', category: 'Business', ein: '123456789', businessNameControl: 'ACME',
        };
        check('A well-formed Business settings object passes with no errors', packager.validatePackagingSettings(validBusiness).length === 0);

        const badFormats = packager.validatePackagingSettings({
          ...validIndividual, submissionId: 'tooshort', efin: '12', taxYear: '99', governmentCode: 'X', primarySSN: '123',
        });
        check('Malformed Submission ID is caught', badFormats.some((e) => e.field === 'submissionId'));
        check('Malformed EFIN is caught', badFormats.some((e) => e.field === 'efin'));
        check('Malformed Tax Year is caught', badFormats.some((e) => e.field === 'taxYear'));
        check('Malformed Government Code is caught', badFormats.some((e) => e.field === 'governmentCode'));
        check('Malformed Primary SSN is caught', badFormats.some((e) => e.field === 'primarySSN'));

        check('Business category without EIN is caught', packager.validatePackagingSettings({ ...validBusiness, ein: '' }).some((e) => e.field === 'ein'));
        check('More than 50 state attachments is caught', packager.validatePackagingSettings({ ...validIndividual, stateAttachmentCount: 51 }).some((e) => e.field === 'stateAttachments'));
        check('IRS Submission ID, if given, must be 20 characters', packager.validatePackagingSettings({ ...validIndividual, irsSubmissionId: 'short' }).some((e) => e.field === 'irsSubmissionId'));
        check('Optional Spouse SSN, when given, is still format-checked', packager.validatePackagingSettings({ ...validIndividual, spouseSSN: '123' }).some((e) => e.field === 'spouseSSN'));
      }

      // ==================================================================
      // C. buildManifestXml — §19 "Manifest XML"
      // ==================================================================
      {
        const ind = packager.buildManifestXml({
          submissionId: '1234567890123ABCDEFG', efin: '123456', taxYear: '2024', governmentCode: 'CA01',
          submissionType: 'HIN11', category: 'Individual', primarySSN: '123456789', primaryNameControl: 'SMIT',
        });
        check('Individual manifest contains SubmissionCategoryCd=IND', ind.includes('<SubmissionCategoryCd>IND</SubmissionCategoryCd>'));
        check('Individual manifest contains PrimarySSN', ind.includes('<PrimarySSN>123456789</PrimarySSN>'));
        check('Individual manifest omits EIN entirely', !ind.includes('<EIN>'));
        check('Individual manifest omits optional SpouseSSN when not given', !ind.includes('<SpouseSSN>'));

        const bus = packager.buildManifestXml({
          submissionId: '1234567890123ABCDEFG', efin: '123456', taxYear: '2024', governmentCode: 'CA01',
          submissionType: 'A & B', category: 'Business', ein: '123456789', businessNameControl: 'ACME',
        });
        check('Business manifest contains SubmissionCategoryCd=BUS', bus.includes('<SubmissionCategoryCd>BUS</SubmissionCategoryCd>'));
        check('Business manifest contains EIN', bus.includes('<EIN>123456789</EIN>'));
        check('Business manifest omits PrimarySSN entirely', !bus.includes('<PrimarySSN>'));
        check('Text values are XML-escaped', bus.includes('<StateSubmissionTyp>A &amp; B</StateSubmissionTyp>'));
      }

      // ==================================================================
      // D. Last-used settings persistence — File lists are stripped
      // ==================================================================
      {
        clearLocalStorage();
        const fakeFile = new File(['x'], 'a.pdf');
        packager.saveLastPackagingSettings({ submissionId: '1234567890123ABCDEFG', category: 'Individual', stateAttachments: [fakeFile], stateAttachmentCount: 1 });
        const loaded = packager.loadLastPackagingSettings();
        check('Saved settings round-trip through localStorage', loaded?.submissionId === '1234567890123ABCDEFG');
        check('File lists are NOT persisted (not JSON-serializable)', !('stateAttachments' in (loaded ?? {})));
        check('Nothing saved yet returns null', (() => { clearLocalStorage(); return packager.loadLastPackagingSettings() === null; })());
      }

      // ==================================================================
      // E. buildZip — full round trip via the hand-rolled reader above
      // ==================================================================
      {
        const compressible = new TextEncoder().encode('A'.repeat(5000));
        const small = new TextEncoder().encode('hello');
        const zipBlob = await packager.buildZip([
          { name: 'big.txt', data: compressible },
          { name: 'small.txt', data: small },
        ]);
        check('buildZip returns a Blob typed application/zip', zipBlob instanceof Blob && zipBlob.type === 'application/zip');

        const entries = await readZip(zipBlob);
        check('The archive round-trips through a real ZIP reader with 2 entries', entries.length === 2);
        const big = entries.find((e) => e.name === 'big.txt');
        const smallEntry = entries.find((e) => e.name === 'small.txt');
        check('A highly-compressible entry is deflated (method 8) and shrinks', big?.method === 8 && big.compressedSize < big.uncompressedSize);
        check('Decompressed content matches the original bytes exactly', big?.text === 'A'.repeat(5000));
        check('CRC-32 recorded in the archive matches the original data', big && packager.crc32(compressible) === big.crc);
        check('A second entry decompresses correctly too', smallEntry?.text === 'hello');

        // Store fallback: pretend CompressionStream doesn't exist.
        const originalCS = window.CompressionStream;
        try {
          window.CompressionStream = undefined;
          const storedBlob = await packager.buildZip([{ name: 'plain.txt', data: small }]);
          const storedEntries = await readZip(storedBlob);
          check('Without CompressionStream, entries fall back to stored (method 0)', storedEntries[0]?.method === 0);
          check('...and still round-trip correctly', storedEntries[0]?.text === 'hello');
        } finally {
          window.CompressionStream = originalCS;
        }
      }

      // ==================================================================
      // F. buildSubmissionPackage — full file layout per §19's ZIP diagram
      // ==================================================================
      {
        const settings = {
          submissionId: '1234567890123ABCDEFG', efin: '123456', taxYear: '2024', governmentCode: 'CA01',
          submissionType: 'HIN11', category: 'Individual', primarySSN: '123456789', primaryNameControl: 'SMIT',
        };
        const stateAttachment = new File(['%PDF-fake'], 'attachment1.pdf');
        const federalReturn = new File(['<Federal/>'], 'ignored-name.xml');
        const federalAttachment = new File(['%PDF-fake-2'], 'fed_attachment.pdf');

        const { blob, filename } = await packager.buildSubmissionPackage({
          settings,
          packetXml: '<SamplePacket><Foo>bar</Foo></SamplePacket>',
          packetFileName: 'SamplePacket.xml',
          stateAttachments: [stateAttachment],
          federalReturnFile: federalReturn,
          federalAttachments: [federalAttachment],
        });
        check('Package filename is "[SubmissionId].zip"', filename === '1234567890123ABCDEFG.zip');

        const entries = await readZip(blob);
        const names = entries.map((e) => e.name).sort();
        check('Archive contains exactly the documented file layout', JSON.stringify(names) === JSON.stringify(['attachment1.pdf', 'federal/fed_attachment.pdf', 'federal/federal_return.xml', 'manifest.xml', 'SamplePacket.xml'].sort()));
        check('manifest.xml content is the generated StateManifest', entries.find((e) => e.name === 'manifest.xml')?.text.includes('<StateManifest>'));
        check('Packet XML content matches what was passed in', entries.find((e) => e.name === 'SamplePacket.xml')?.text === '<SamplePacket><Foo>bar</Foo></SamplePacket>');
        check('Federal return is renamed to federal_return.xml regardless of its original filename', entries.find((e) => e.name === 'federal/federal_return.xml')?.text === '<Federal/>');
        check('State attachment keeps its original filename at the archive root', entries.find((e) => e.name === 'attachment1.pdf')?.text === '%PDF-fake');
        check('Federal attachment keeps its original filename under federal/', entries.find((e) => e.name === 'federal/fed_attachment.pdf')?.text === '%PDF-fake-2');
      }

      // ==================================================================
      // G. packaging.js UI — dialog wiring against a real schema/form
      // ==================================================================
      {
        clearLocalStorage();
        const filenames = ['SamplePacket.xsd', 'SampleCommonTypes.xsd', 'SampleGroups.xsd'];
        const fileTextMap = new Map();
        for (const name of filenames) fileTextMap.set(name, await (await fetch(`../sample-schemas/${name}`)).text());
        const [rootFile] = findRootFileCandidates(fileTextMap);
        const { doc: flatDoc, targetNamespace } = flattenFromRoot(fileTextMap, rootFile);
        const [rootElementName] = findRootElementCandidates(flatDoc);
        const parser = new SchemaParser(flatDoc, rootElementName);
        const manifest = analyzePacket(flatDoc, rootElementName);

        const formEngine = new FormEngine();
        const entityKey = new FormInstanceKey('SampleEntityForm');
        const appState = { manifest: null, schemaParser: parser, formEngine, instanceKeys: [entityKey], currentInstanceKey: null, targetNamespace };

        function buildCurrentPacketXml() {
          formEngine.flushRegisteredControls();
          return buildPacketXml(appState.manifest, formEngine.getAllFormStates(), appState.instanceKeys, appState.schemaParser, appState.targetNamespace);
        }
        async function withBusyOverlay(message, work) {
          return work(); // no real overlay DOM needed for this test
        }

        packagingUi.wirePackaging({ appState, buildPacketXml: buildCurrentPacketXml, withBusyOverlay });

        const createPackageBtn = document.getElementById('create-package-btn');
        check('Create Package button starts disabled (no schema loaded yet)', createPackageBtn.disabled);

        appState.manifest = manifest;
        packagingUi.refreshCreatePackageButton(appState);
        check('Still disabled once schema is loaded but the packet has no data', createPackageBtn.disabled);

        formEngine.setActiveForm(entityKey);
        formEngine.setValue('SampleEntityForm.EntityName', 'Acme Corp'); // dispatches controlValueChanged
        check('Becomes enabled once the packet has at least one field value', !createPackageBtn.disabled);

        // Open the dialog.
        createPackageBtn.click();
        const overlay = document.getElementById('package-dialog-overlay');
        check('Clicking Create Package opens the dialog', !overlay.classList.contains('hidden'));
        check('Dialog renders the core text fields', !!document.getElementById('package-field-submissionId') && !!document.getElementById('package-field-efin'));
        check('Category select defaults to Individual with its field group visible', document.getElementById('package-field-category').value === 'Individual' && !document.getElementById('package-individual-fields').classList.contains('hidden'));

        // Switching to Business toggles the visible field groups.
        const categorySelect = document.getElementById('package-field-category');
        categorySelect.value = 'Business';
        categorySelect.dispatchEvent(new Event('change', { bubbles: true }));
        check('Selecting Business shows the Business fields', !document.getElementById('package-business-fields').classList.contains('hidden'));
        check('...and hides the Individual fields', document.getElementById('package-individual-fields').classList.contains('hidden'));
        categorySelect.value = 'Individual';
        categorySelect.dispatchEvent(new Event('change', { bubbles: true }));

        // Submitting with everything blank surfaces blocking errors and stays open.
        document.getElementById('package-create-btn').click();
        await new Promise((r) => setTimeout(r, 10));
        check('Submitting blank settings shows validation errors', document.getElementById('package-dialog-errors').children.length > 0);
        check('...and the dialog stays open', !overlay.classList.contains('hidden'));

        // Fill valid Individual settings and submit for real, stubbing out the
        // actual file download (a real click on a Blob-URL <a download> would
        // trigger a genuine browser download) and auto-confirming past the
        // schema-validation warning (this sample form is otherwise incomplete).
        document.getElementById('package-field-submissionId').value = '1234567890123ABCDEFG';
        document.getElementById('package-field-efin').value = '123456';
        document.getElementById('package-field-taxYear').value = '2024';
        document.getElementById('package-field-governmentCode').value = 'CA01';
        document.getElementById('package-field-submissionType').value = 'HIN11';
        document.getElementById('package-field-primarySSN').value = '123456789';
        document.getElementById('package-field-primaryNameControl').value = 'SMIT';

        const originalConfirm = window.confirm;
        const originalClick = HTMLAnchorElement.prototype.click;
        let anchorClicked = false;
        window.confirm = () => true; // accept the schema-validation-warnings prompt
        HTMLAnchorElement.prototype.click = function () { anchorClicked = true; };
        try {
          document.getElementById('package-create-btn').click();
          await new Promise((r) => setTimeout(r, 50)); // buildSubmissionPackage/flush are async
        } finally {
          window.confirm = originalConfirm;
          HTMLAnchorElement.prototype.click = originalClick;
        }
        check('A valid submission triggers a download', anchorClicked);
        check('The dialog closes after a successful package build', document.getElementById('package-dialog-overlay').classList.contains('hidden'));
        check('The top status bar reflects the created filename', document.getElementById('top-status').textContent.includes('1234567890123ABCDEFG.zip'));
        check('Settings are persisted for next time', packager.loadLastPackagingSettings()?.submissionId === '1234567890123ABCDEFG');

        // Reopening prefills from the just-saved settings.
        createPackageBtn.click();
        check('Reopening the dialog prefills the Submission ID from last time', document.getElementById('package-field-submissionId').value === '1234567890123ABCDEFG');

        // Cancel closes without side effects.
        document.querySelector('#package-dialog-footer button').click();
        check('Cancel closes the dialog', document.getElementById('package-dialog-overlay').classList.contains('hidden'));

        // Clicking the dimmed backdrop also closes it.
        createPackageBtn.click();
        document.getElementById('package-dialog-overlay').dispatchEvent(new MouseEvent('click', { bubbles: true }));
        check('Clicking the overlay backdrop closes the dialog', document.getElementById('package-dialog-overlay').classList.contains('hidden'));
      }

      summaryEl.textContent = `${pass} passed, ${fail} failed`;
      summaryEl.style.color = fail === 0 ? '#2e7d32' : '#d32f2f';
      console.log(`Phase 8 check: ${pass} passed, ${fail} failed`);
    }

    main().catch((err) => {
      summaryEl.textContent = 'ERROR — see console';
      summaryEl.style.color = '#d32f2f';
      console.error(err);
      const pre = document.createElement('pre');
      pre.textContent = String(err.stack || err);
      resultsEl.appendChild(pre);
    });
  </script>
</body>
</html>
